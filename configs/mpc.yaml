# Planner and validation settings.

planner:
  # 20 steps at 10 Hz = 2 s of lookahead. Raising this is only worth it once
  # drift_horizon says the model is trustworthy that far out.
  horizon: 20
  population: 256
  elites: 32
  iterations: 4
  initial_std: 0.5
  min_std: 0.05
  momentum: 0.1

cost:
  terminal_weight: 1.0
  path_weight: 0.1
  action_weight: 0.01
  smoothness_weight: 0.05

validation:
  ridge: 1.0e-3
  # Report drift_horizon at both a tight and a loose tolerance; the gap between
  # them says whether the model degrades gracefully or falls off a cliff.
  tolerances_m: [0.10, 0.25]
  rollout_steps: 50
  context_steps: 16
